<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElectroField</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
  // local server ships Plotly from the plotly pip package; static hosting (GitHub Pages) uses the pinned CDN build
  (function () {
    var local = location.protocol !== 'file:' && !location.hostname.endsWith('github.io') && !/[?&]backend=pyodide/.test(location.search);
    document.write('<script src="' + (local ? 'vendor/plotly.min.js' : 'https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js') + '"><\/script>');
  })();
</script>
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/">ElectroField</a>
    <p class="brand-sub">Applied electromagnetics, computed and verified</p>
    <nav id="toc"></nav>
    <p class="side-foot">Notation follows Ulaby &amp; Ravaioli, <i>Fundamentals of Applied Electromagnetics</i>, and Cheng, <i>Field and Wave Electromagnetics</i>.</p>
  </aside>
  <main id="view"></main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
